<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Empty House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e0b16">
<style>
/* Tata letak: satu kolom potret. HUD di atas, kanvas piksel 11:10, lalu pad kontrol (atau menu pertarungan). Aksen berganti menurut waktu: senja, malam, pagi. */
:root{
  --ink:#0e0b16; --panel:#1b1528; --panel2:#2a2140; --line:#4a3d6b;
  --text:#f1e8d4; --dim:#a99dc0; --accent:#f2a65a; --danger:#e4505e; --good:#7ddba6; --focus:#8fb4ff;
  --f-display:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-ui:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --chrome:300px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-ui);font-size:14px;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px}

/* HUD */
#hud{display:grid;gap:6px;flex:none}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.when{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.when b{color:var(--accent)}
.when .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tools{display:flex;gap:6px}
.tool{min-width:44px;height:36px;padding:0 9px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:13px}
.tool:active,.tool.on{background:var(--panel2);border-color:var(--accent)}
.bars{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.bar{position:relative;height:20px;border:1px solid var(--line);background:#120d1d;border-radius:4px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#b8334a,#e4505e);transition:width .25s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.05em;text-shadow:0 1px 0 #000}
.pips{display:flex;gap:7px;padding-right:4px}
.rt{display:flex;align-items:center;gap:10px}
.coin{font:700 12px var(--f-ui);color:#ffd35a;white-space:nowrap;letter-spacing:.03em}
.coin::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffd35a;box-shadow:inset -2px -2px 0 #c9962a;margin-right:5px;vertical-align:-1px}
.acc.owned{border-color:var(--good)}
.pip{width:13px;height:13px;transform:rotate(45deg);border:1px solid var(--focus);border-radius:2px}
.pip.on{background:var(--focus);box-shadow:0 0 8px var(--focus)}
.goal{font-family:var(--f-display);font-size:14px;line-height:1.3;min-height:2.6em;color:var(--text)}
.goal b{color:var(--accent);font-weight:600}

/* Panggung */
#stage{position:relative;flex:none;width:min(100%,max(260px,calc((100vh - var(--chrome)) * 1.1)));width:min(100%,max(260px,calc((100dvh - var(--chrome)) * 1.1)));aspect-ratio:11/10;margin-inline:auto;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;inset:0;pointer-events:none}
#ov>*{pointer-events:auto}
.dlg{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(14,11,22,.95);border:2px solid var(--accent);border-radius:8px;padding:12px 12px 14px;font-family:var(--f-display);font-size:16px;line-height:1.35;min-height:72px;cursor:pointer}
.dlg .who{position:absolute;top:-12px;left:10px;background:var(--accent);color:#1a1208;font:700 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.dlg .nx{position:absolute;right:10px;bottom:3px;color:var(--accent);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.dlg .btn{margin-top:8px}
.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(14,11,22,.92);border:1px solid var(--accent);padding:6px 12px;border-radius:999px;font-size:12px;letter-spacing:.04em;white-space:nowrap;pointer-events:none!important;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}}

/* Tombol umum */
.btn{display:block;width:100%;min-height:56px;padding:10px 14px;margin:0;border:2px solid var(--line);background:var(--panel);border-radius:8px;font-family:var(--f-display);font-size:16px;line-height:1.25;text-align:left;cursor:pointer}
.btn small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.03em}
.btn:active,.btn.sel{border-color:var(--accent);background:var(--panel2)}
.btn.sel{outline:2px solid var(--accent);outline-offset:1px}
.btn[disabled]{opacity:.42}
.btn.ok{border-color:var(--good);background:#16301f}
.btn.no{border-color:var(--danger);background:#38161d}
.btn.center{text-align:center}

/* Pad sentuh */
#pad{flex:1;min-height:150px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.dpad{position:relative;width:168px;height:168px;flex:none}
.dpad button{position:absolute;width:56px;height:56px;border:2px solid var(--line);background:var(--panel);border-radius:10px;font-size:20px;color:var(--dim)}
.dpad button:active{background:var(--panel2);border-color:var(--accent);color:var(--text)}
.dpad .u{left:56px;top:0}.dpad .d{left:56px;top:112px}.dpad .l{left:0;top:56px}.dpad .r{left:112px;top:56px}
.ab{display:flex;gap:16px;align-items:flex-end;flex:none;padding-right:4px}
.ab button{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:22px;font-weight:700;display:grid;place-items:center;line-height:1}
.ab button small{display:block;font-size:10px;font-weight:400;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.ab button:active{background:var(--panel2);border-color:var(--accent)}
.ab .a{margin-bottom:44px;border-color:var(--accent)}
@media (pointer:fine){ :root{--chrome:160px} #pad{display:none} #app.touch #pad{display:flex} #app.touch{--chrome:300px} }

/* Panel pertarungan */
#bp{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
#bp .btn{text-align:center;padding:8px 6px;font-size:15px}
#bp .btn small{margin-top:1px}

/* Modal */
#modal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(10,8,18,.97);border:2px solid var(--line);border-radius:8px;overflow:auto}
#modal h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;line-height:1.15}
.sub{color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.list{display:grid;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .tool{height:40px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;font-family:var(--f-display);font-size:15px;line-height:1.35}
.card b{color:var(--accent);font-weight:600}
.card.done{opacity:.55;text-decoration:line-through}
.card .tag{font:11px var(--f-ui);color:var(--dim);letter-spacing:.05em;display:block;margin-bottom:2px}
.muted{color:var(--dim)}
.spacer{flex:1}
.range{width:100%;height:36px;accent-color:var(--accent)}

/* Kuis pintu */
.locks{display:flex;gap:8px;align-items:center}
.lk{width:26px;height:26px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:13px}
.lk.on{border-color:var(--good);background:#16301f;color:var(--good)}
.qtxt{font-family:var(--f-display);font-size:19px;line-height:1.35}
.note{border-left:3px solid var(--accent);padding:6px 10px;font-family:var(--f-display);font-size:15px;line-height:1.35;background:var(--panel)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Bisik */
.chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px;overflow:auto}
.bub{max-width:86%;padding:8px 12px;border-radius:12px;font-family:var(--f-display);font-size:15px;line-height:1.35}
.bub.din{align-self:flex-start;background:#26324a;border:1px solid #3d4f78}
.bub.me{align-self:flex-end;background:#3a2a1a;border:1px solid #6b4a24}
.bub small{display:block;font:10px var(--f-ui);letter-spacing:.08em;color:var(--focus);text-transform:uppercase;margin-bottom:2px}

/* Judul & akhir */
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14px;background:linear-gradient(180deg,transparent 28%,rgba(10,8,18,.92) 62%)}
.title h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,9vw,40px);line-height:1;margin:0;letter-spacing:.01em}
.title .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.title .btn{min-height:52px}
.hint{font-size:11px;color:var(--dim);line-height:1.5}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel);color:var(--text)}

/* Pertarungan: HUD hantu */
.gh{position:absolute;top:6px;left:6px;right:6px;display:grid;gap:4px;pointer-events:none!important}
.gh .nm{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.05em;text-shadow:0 1px 0 #000}
.gh .gb{height:10px;border:1px solid var(--line);background:#120d1d;border-radius:3px;overflow:hidden}
.gh .gb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6fd6c0,#a8f0dc);transition:width .3s}
.tell{align-self:start;justify-self:start;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--danger);background:rgba(60,14,24,.9);color:#ffd2d8;letter-spacing:.03em}
.tell.safe{border-color:var(--good);background:rgba(16,48,32,.9);color:#c8f5dc}
.blog{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(14,11,22,.93);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--f-display);font-size:15px;line-height:1.3;min-height:56px;pointer-events:none!important}
.pull{position:absolute;left:10px;right:10px;bottom:70px;height:34px;border:2px solid var(--accent);border-radius:8px;background:#120d1d;overflow:hidden;pointer-events:none!important}
.pull .zone{position:absolute;top:0;bottom:0;background:rgba(125,219,166,.5)}
.pull .mk{position:absolute;top:-2px;bottom:-2px;width:6px;background:#fff;box-shadow:0 0 8px #fff}

.jscare{position:absolute;inset:0;z-index:50;background:#000;overflow:hidden;pointer-events:none!important}
.jscare canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;animation:jsz .95s cubic-bezier(.2,.9,.3,1) forwards}
.jscare::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,0,0,0) 30%,rgba(130,0,0,.8) 100%);animation:jsf .95s forwards}
@keyframes jsz{0%{transform:scale(.15);opacity:0}8%{opacity:1}30%{transform:scale(1.05) rotate(-2deg)}40%{transform:scale(1.18) rotate(2deg)}55%{transform:scale(1.1) rotate(-1.5deg)}100%{transform:scale(1.28)}}
@keyframes jsf{0%{opacity:0}12%{opacity:1}100%{opacity:.85}}
.title.hero{justify-content:flex-start;align-items:center;text-align:center;background:linear-gradient(180deg,rgba(8,6,16,.84) 0%,rgba(8,6,16,.4) 36%,transparent 60%);padding:12px 10px}
.title.compact{pointer-events:none!important}
.logo{display:flex;flex-direction:column;align-items:center;gap:3px;animation:logoin 1.2s ease-out both}
.logo .pre{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.logo .the{font-family:var(--f-display);font-size:14px;letter-spacing:.5em;margin-left:.5em;color:var(--dim);display:flex;align-items:center;gap:8px}
.logo .the::before,.logo .the::after{content:'';width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.logo .the::after{background:linear-gradient(90deg,var(--accent),transparent)}
.logo h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,9.6vw,46px);letter-spacing:.07em;line-height:1;margin:0;color:#f6ecd6;text-shadow:0 0 6px rgba(242,166,90,.7),0 0 22px rgba(242,166,90,.45),0 2px 0 #000;animation:flick 5s steps(1) infinite}
.logo .logo-sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-top:2px}
@keyframes logoin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.55}43%{opacity:1}44%{opacity:.7}45%{opacity:1}}
@keyframes pulse2{50%{opacity:.25}}
@keyframes glow{50%{box-shadow:0 0 26px rgba(242,166,90,.55)}}
@keyframes mnin{from{opacity:0;transform:translateY(8px)}}
.splash-btn{position:absolute;inset:0;width:100%;border:0;background:transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;color:var(--text);font:600 12px var(--f-ui);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.blink{animation:pulse2 1.6s ease-in-out infinite;background:rgba(10,7,18,.72);border:1px solid var(--line);border-radius:999px;padding:6px 14px;text-shadow:0 1px 0 #000}
#menu{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:6px 0 4px;overflow:auto;animation:mnin .5s ease-out both}
.btn.primary{min-height:62px;text-align:center;font-size:19px;border-color:var(--accent);background:linear-gradient(180deg,#3a2a52,#2a2140);box-shadow:0 0 16px rgba(242,166,90,.35);animation:glow 2.6s ease-in-out infinite}
.btn.primary small{font-size:11px}
.btn.mini{min-height:48px;padding:6px;text-align:center;font-size:14px}
.menu-row{display:grid;gap:8px}
.menu-row.c3{grid-template-columns:repeat(3,1fr)}
.menu-row.c4{grid-template-columns:repeat(4,1fr)}
.menu-foot{text-align:center;font-size:11px;color:var(--dim);letter-spacing:.08em;margin-top:2px}
.cine{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.cine::before,.cine::after{content:'';position:absolute;left:0;right:0;height:8%;background:#000;z-index:0}
.cine::before{top:0}.cine::after{bottom:0}
.cine .cap{position:relative;z-index:1;margin:0 6px calc(8% + 4px);background:rgba(14,11,22,.82);border:1px solid var(--line);border-radius:8px;padding:7px 10px 9px;font-family:var(--f-display);font-size:13px;line-height:1.35;min-height:62px;background:rgba(14,11,22,.78)}
.cine .nx{color:var(--accent);animation:bl 1s steps(2) infinite}
.cine .skip{position:absolute;z-index:2;top:calc(8% + 6px);right:8px;border:1px solid var(--line);background:rgba(14,11,22,.8);border-radius:999px;padding:5px 10px;font:11px var(--f-ui);letter-spacing:.06em;color:var(--dim)}
.hsel{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:12px 10px;overflow:auto;background:linear-gradient(180deg,rgba(8,6,16,.94),rgba(8,6,16,.88))}
.hsel h2{margin:0 0 2px;text-align:center;font-family:var(--f-display);font-size:20px;letter-spacing:.08em;color:#f6ecd6}
.hcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#1c1530;color:var(--text);cursor:pointer}
.hcard:active,.hcard:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(242,166,90,.35)}
#netb{position:absolute;top:5px;right:41px;z-index:40;height:30px;min-width:30px;padding:0 7px;border-radius:7px;border:1px solid var(--line);background:rgba(14,11,22,.6);color:var(--text);font-size:14px;line-height:1;opacity:.75;display:flex;align-items:center;gap:4px}
#netb i{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block}
#netb.on i{background:#4be07a;box-shadow:0 0 6px #4be07a}
#app.is-battle #netb,#ov:has(.cine)~#fsb~#netb{display:none}
#netp{position:absolute;inset:0;z-index:80;background:rgba(8,6,16,.94);overflow:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:9px}
#netp h2{margin:0;text-align:center;font-family:var(--f-display);font-size:20px;color:#f6ecd6}
#netp p{margin:0;font-size:12px;color:var(--dim);line-height:1.45}
#netp textarea{width:100%;min-height:84px;resize:none;border-radius:8px;border:1px solid var(--line);background:#120d1d;color:var(--text);font:11px ui-monospace,monospace;padding:6px;box-sizing:border-box}
#netp .row{display:flex;gap:8px}#netp .row>*{flex:1}
#netp .nb{min-height:44px;border-radius:9px;border:1px solid var(--line);background:#1c1530;color:var(--text);font-size:14px;padding:6px}
#netp .nb.pri{border-color:var(--accent);background:linear-gradient(180deg,#3a2a52,#2a2140)}
#netp .fr{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#1c1530}
#netp .fr i{width:10px;height:10px;border-radius:50%;background:#4be07a;box-shadow:0 0 8px #4be07a}
#netp .st{font-size:12px;color:var(--accent);text-align:center;min-height:16px}
.xpbar{grid-column:1/-1;position:relative;height:13px;border-radius:7px;background:#1a1426;border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f63c8,#7ef0ff);transition:width .4s}
.xpbar span{position:absolute;inset:0;text-align:center;font:600 10px/13px ui-monospace,monospace;color:#fff;text-shadow:0 1px 1px #000;letter-spacing:.04em}
.lives{font-size:15px;letter-spacing:1px;color:#ff5a6e;text-shadow:0 0 6px rgba(255,60,90,.5);white-space:nowrap}
.lives .off{color:#5a4452;text-shadow:none}
.menu-row.c2{grid-template-columns:1fr 1fr}
.mcard,.mcardx{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;min-height:58px}
.mcard .ic,.mcardx .ic{font-size:26px;line-height:1;flex:none}
.mcard b,.mcardx b{display:block;font-size:15px}
.mcard small,.mcardx small{display:block;font-size:11px;opacity:.85;line-height:1.3;margin-top:1px}
.mcard.c-blue{background:linear-gradient(135deg,#2f63c8,#4a8cf0)}
.mcard.c-green{background:linear-gradient(135deg,#2a9a6a,#4ccf8a)}
.mcard.c-pink{background:linear-gradient(135deg,#c8407e,#f07aaa)}
.mcard:active{transform:scale(.98)}
.mcardx{background:linear-gradient(135deg,#27204a,#352b66);border-color:var(--line)}
.mcardx:hover,.mcardx:active{border-color:var(--accent)}
.hcard canvas{display:block;width:100%;height:auto;aspect-ratio:120/52;image-rendering:pixelated;border-radius:7px;margin-bottom:5px;border:1px solid rgba(255,255,255,.08)}
.hcard b{font-family:var(--f-display);font-size:17px;color:#f6ecd6}
.hcard span{font-size:12px;color:var(--accent);letter-spacing:.05em}
.hcard small{font-size:12px;color:var(--dim);line-height:1.35}
.hback{align-self:center;border:0;background:transparent;color:var(--dim);font-size:13px;padding:8px}
@media (prefers-reduced-motion:reduce){.dlg .nx,.shake,.toast,.jscare canvas,.btn.primary,.logo h1,.logo,.blink,#menu{animation:none}}
.whisper{position:absolute;left:8%;right:8%;bottom:30%;text-align:center;font-family:var(--f-display);font-style:italic;font-size:15px;letter-spacing:.04em;color:#e6d8ff;text-shadow:0 0 10px #a98bff,0 0 22px #6a4cd8,0 1px 0 #000;pointer-events:none!important;z-index:4;animation:whs 4.2s ease-in-out forwards}

<script>

/* ===== Inti: utilitas, penyimpanan, suara, input, dialog, navigasi menu ===== */

const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },

const S = Object.assign({ sound: true, vol: 0.6, touch: false, sm: 'lembut' }, store.get('rmelati.set') || {});

/* ---- Suara sintetis (WebAudio, tanpa berkas) ---- */
/* Mode suara: tiap mode punya warna bunyi, gema, dan musik latar sendiri. */
const SMODES = {
  lembut: { n: 'Lembut', d: 'Dentingan hangat dan tenang. Paling nyaman di telinga.', att: .02, lp: 3600, wet: .3, rev: 1.9, vs: .95, ns: .6, amb: .04, chorus: 1, map: { square: 'triangle', sawtooth: 'sine', triangle: 'triangle', sine: 'sine' } },
  kotak: { n: 'Kotak Musik', d: 'Denting jernih seperti kotak musik, manis dan ringan.', att: .003, lp: 8000, wet: .35, rev: 2.2, vs: 1, ns: .4, amb: .02, bell: 1, map: {} },
  retro: { n: 'Retro 8-bit', d: 'Bunyi game klasik yang ceria.', att: .004, lp: 9000, wet: .06, rev: .5, vs: .55, ns: .9, amb: .015, map: { square: 'square', sawtooth: 'sawtooth', triangle: 'square', sine: 'triangle' } },
  misteri: { n: 'Misteri', d: 'Gema dalam dan panjang, terasa seperti rumah tua.', att: .04, lp: 2000, wet: .55, rev: 3.2, vs: 1, ns: 1, amb: .065, chorus: 1, map: { square: 'sawtooth', sawtooth: 'sawtooth', triangle: 'triangle', sine: 'sine' } },
  minimal: { n: 'Efek singkat', d: 'Hanya efek pendek, tanpa musik dan dengungan latar.', att: .01, lp: 4000, wet: .1, rev: .8, vs: .9, ns: .7, amb: 0, map: { square: 'triangle', sawtooth: 'sine', triangle: 'triangle', sine: 'sine' } }
};
const SM_KEYS = Object.keys(SMODES);
const curSM = () => SMODES[S.sm] || SMODES.lembut;
const Snd = {
  ctx: null, master: null, bus: null, send: null, conv: null, ambTimer: 0, battleTimer: 0, act: 0, bi: 0, ambNodes: [], drone: null,
  init() {
    if (this.ctx) return;

      this.send = c.createGain(); this.send.connect(this.master);

  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); },
  impulse(sec) {

    return b;
  },
  setMode(id, quiet) {
    if (!SMODES[id]) id = 'lembut'; S.sm = id; saveSettings();
    if (!this.ctx) return;
    const M = curSM();
    try { if (this.conv) { this.conv.disconnect(); this.send.disconnect(); this.send.connect(this.master); } } catch (e) { }
    this.conv = this.ctx.createConvolver(); this.conv.buffer = this.impulse(M.rev); this.send.connect(this.conv); this.conv.connect(this.master);
    this.apply();
    if (!quiet) { this.stopAmb(); this.startAmb(); if (this.battleTimer) this.battle(true); }
  },
  apply() { if (!this.master) return; const t = this.ctx.currentTime; this.master.gain.setTargetAtTime(S.sound ? S.vol : 0, t, 0.05); this.send.gain.setTargetAtTime(curSM().wet, t, 0.05); },
  tone(f, d, type = 'sine', v = 0.2, slide = 0, delay = 0) {
    if (!this.ctx || !S.sound) return;
    const c = this.ctx, M = curSM(), t = c.currentTime + delay; v *= M.vs;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = M.lp;
    const g = c.createGain(), att = Math.min(M.att, d * 0.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    const osc = (fr, wave, det, amp) => {
      if (fr > 12000) return;

  noise(d, v = 0.15, lp = 2400, hp = 0, delay = 0) {

  },
  play(n) {
    const M = curSM();
    switch (n) {
      case 'step': if (S.sm === 'retro') this.tone(110, 0.04, 'square', 0.05); else this.noise(0.07, 0.07, 800, 120); break;
      case 'click': this.tone(700, 0.06, 'sine', 0.09); break;
      case 'item': this.tone(659, 0.12, 'triangle', 0.16); this.tone(988, 0.22, 'triangle', 0.16, 0, 0.08); break;
      case 'key': [1319, 1760, 2093].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.14, 0, i * 0.08)); break;
      case 'door': this.tone(110, 0.6, 'sawtooth', 0.06, -40); this.noise(0.45, 0.05, 700, 80); break;
      case 'locked': this.tone(150, 0.14, 'square', 0.12); this.tone(112, 0.2, 'square', 0.12, 0, 0.13); break;
      case 'good': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.16, 0, i * 0.08)); break;
      case 'bad': this.tone(233, 0.3, 'sawtooth', 0.1); this.tone(175, 0.5, 'sawtooth', 0.1, 0, 0.14); break;
      case 'hit': this.noise(0.16, 0.22, 1800, 0); this.tone(150, 0.18, 'square', 0.16, -70); break;
      case 'hurt': this.noise(0.22, 0.26, 1400, 0); this.tone(100, 0.32, 'sawtooth', 0.14, -40); vib(80); break;
      case 'guard': this.tone(880, 0.22, 'square', 0.1); this.tone(1320, 0.35, 'triangle', 0.1, 0, 0.04); break;
      case 'perfect': [784, 988, 1319].forEach((f, i) => this.tone(f, 0.4, 'triangle', 0.16, 0, i * 0.06)); break;
      case 'ghost': this.tone(420, 0.8, 'triangle', 0.11, -280); this.tone(425, 0.8, 'triangle', 0.09, -300, 0.02); break;
      case 'sting': this.tone(70, 1, 'sawtooth', 0.1, -20); this.tone(311, 0.7, 'square', 0.05, -80); this.noise(0.5, 0.1, 3000, 800); break;
      case 'meow': this.tone(780, 0.28, 'triangle', 0.12, -300); this.tone(1100, 0.18, 'sine', 0.06, -400, 0.03); break;
      case 'woof': this.noise(0.08, 0.12, 1500, 200); this.tone(240, 0.14, 'square', 0.14, -90); this.noise(0.08, 0.12, 1500, 200, 0.2); this.tone(240, 0.12, 'square', 0.12, -80, 0.2); break;
      case 'squeak': this.tone(1500, 0.07, 'sine', 0.1, 400); this.tone(1700, 0.07, 'sine', 0.08, 300, 0.09); break;
      case 'whisper': this.noise(1.5, 0.05, 2400, 900); this.tone(196, 1.7, 'sine', 0.04, -30); this.tone(233, 1.7, 'sine', 0.03, -40, 0.12); break;
      case 'wisp': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.7, 'sine', 0.1, 0, i * 0.07)); break;
      case 'tink': this.tone(2637, 0.5, 'sine', 0.07); this.tone(3951, 0.4, 'sine', 0.04, 0, 0.07); break;
      case 'heart': this.tone(55, 0.14, 'sine', 0.42); this.tone(48, 0.16, 'sine', 0.36, 0, 0.19); break;
      case 'boom': this.tone(48, 1.2, 'sine', 0.7, -25); this.tone(32, 1.4, 'sine', 0.6, -10, 0.02); this.noise(0.5, 0.45, 900, 60); break;
      case 'scream': this.noise(1.0, 0.35, 5000, 700); [880, 932, 1245, 1397].forEach((f, i) => this.tone(f, 0.9, 'sawtooth', 0.12, -420, i * 0.03)); this.tone(70, 1.1, 'sawtooth', 0.3, -30, 0.05); break;
      case 'scare': this.noise(0.55, 0.5, 6000, 200); this.tone(90, 0.8, 'sawtooth', 0.3, -40); this.tone(1245, 0.6, 'square', 0.18, -600); this.tone(1318, 0.6, 'square', 0.16, -640, 0.01); this.tone(60, 0.9, 'sine', 0.4); vib([120, 40, 220]); break;
      case 'heal': [440, 554, 659].forEach((f, i) => this.tone(f, 0.4, 'sine', 0.15, 0, i * 0.08)); break;
      case 'level': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.4, 'triangle', 0.16, 0, i * 0.09)); break;
      case 'focus': this.tone(600, 0.35, 'sine', 0.13, 500); break;
      case 'pull': this.tone(200, 0.4, 'sawtooth', 0.1, 600); break;
      case 'bell': [392, 523, 784].forEach((f, i) => { this.tone(f, 1.8, 'sine', 0.2, 0, i * 0.35); this.tone(f * 2, 1.3, 'sine', 0.07, 0, i * 0.35); }); break;

      case 'coin': this.tone(1319, 0.1, 'triangle', 0.14); this.tone(1760, 0.3, 'triangle', 0.14, 0, 0.07); break;
      case 'demo': [523, 659, 784, 988].forEach((f, i) => this.tone(f, 0.5, 'triangle', 0.15, 0, i * 0.12)); this.tone(262, 1.2, 'sine', 0.12, 0, 0.5); break;
    }
  },
  stopAmb() {
    clearTimeout(this.ambTimer); this.ambTimer = 0;
    this.ambNodes.forEach(o => { try { o.stop(); } catch (e) { } }); this.ambNodes = [];

  },
  startAmb() {

      const M = curSM();

        if (this.act === 2) { this.tone(rnd(2400, 4200), 0.1, 'sine', 0.05, rnd(300, 900)); if (r < 0.5) this.tone(rnd(2600, 4000), 0.09, 'sine', 0.04, 500, 0.14); }

      }

    };

  const drips = Array.from({ length: 22 }, () => ({ x: Math.random() * 176, v: 25 + Math.random() * 90, w: 1 + Math.floor(Math.random() * 3) }));
  const cracks = Array.from({ length: 5 }, () => ({ x: 20 + Math.random() * 136, y: 20 + Math.random() * 120, a: Math.random() * 6.28, n: 5 + Math.floor(Math.random() * 4) }));

  await new Promise(res => {
    setTimeout(res, 3200);
    const step = () => {
      const t = (performance.now() - t0) / 1000; if (t >= END) return res();

      if (t < T1) {

        const rg = g.createRadialGradient(88, ey, 1, 88, ey, 26); rg.addColorStop(0, 'rgba(255,20,40,' + 0.45 * a + ')'); rg.addColorStop(1, 'rgba(255,0,0,0)'); g.fillStyle = rg; g.fillRect(40, 30, 96, 72);
        g.fillStyle = 'rgba(255,40,50,' + (0.5 + 0.5 * a) + ')'; g.fillRect(Math.round(88 - d - 3), Math.round(ey), 6, 2); g.fillRect(Math.round(88 + d - 3), Math.round(ey), 6, 2);
        g.fillStyle = 'rgba(0,0,0,.35)'; for (let y = 0; y < 160; y += 3) g.fillRect(0, y, 176, 1);
        requestAnimationFrame(step); return;
      }
      if (!slam) { slam = true; Snd.play('boom'); Snd.play('scare'); setTimeout(() => Snd.play('scream'), 90); setTimeout(() => Snd.play('scream'), 520); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); vib([200, 40, 120, 40, 250]); }

      if (u < 0.09) { g.fillStyle = '#fff'; g.fillRect(0, 0, 176, 160); requestAnimationFrame(step); return; }
      const phase = Math.floor(u * 18) % 6, flick = !calm && phase === 4;
      g.fillStyle = flick ? '#fff' : (phase === 2 && !calm ? '#3a0008' : '#120004'); g.fillRect(0, 0, 176, 160);
      const gr = g.createRadialGradient(88, 80, 8, 88, 80, 118); gr.addColorStop(0, 'rgba(210,0,30,' + (0.75 + 0.25 * Math.sin(u * 40)) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 176, 160);
      const z = Math.min(1, u / 0.18), sc = 0.8 + z * z * 0.85 + (u > 0.18 ? Math.sin(u * 26) * 0.06 + u * 0.18 : 0), sz = 160 * sc;
      const J = u < 0.18 ? 3 : 11, jx = (Math.random() - 0.5) * J, jy = (Math.random() - 0.5) * J, bx = 88 - sz / 2 + jx, by = 84 - sz / 2 + jy;
      g.globalAlpha = Math.random() < 0.06 ? 0.5 : 1;
      /* gambar per irisan horizontal: wajah terdistorsi */
      const sl = 16, src = flick && sprW ? sprW : spr, ssh = src.height / sl, dsh = sz / sl;
      for (let i = 0; i < sl; i++) { const off = Math.random() < 0.28 ? (Math.random() - 0.5) * 30 * (calm ? 0.3 : 1) : 0; g.drawImage(src, 0, i * ssh, src.width, ssh, bx + off, by + i * dsh, sz, dsh + 1); }
      /* semburat merah dan mata menyala */
      g.globalAlpha = 1; g.globalCompositeOperation = 'multiply'; g.fillStyle = '#b01228'; g.fillRect(0, 0, 176, 160); g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1; const ey = by + sz * 0.38, ex = sz * 0.17, bl = 0.75 + 0.25 * Math.sin(u * 50);
      [88 - ex, 88 + ex].forEach(x => { const rg = g.createRadialGradient(x + jx, ey, 0, x + jx, ey, 14 + 4 * bl); rg.addColorStop(0, 'rgba(255,255,255,' + bl + ')'); rg.addColorStop(0.35, 'rgba(255,30,40,.95)'); rg.addColorStop(1, 'rgba(255,0,0,0)'); g.fillStyle = rg; g.fillRect(x + jx - 18, ey - 18, 36, 36); });
      /* retakan layar */
      if (u > 0.2) { g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1; cracks.forEach(c => { g.beginPath(); let x = c.x, y = c.y; g.moveTo(x, y); for (let k = 0; k < c.n; k++) { x += Math.cos(c.a + k * 0.5) * 11; y += Math.sin(c.a + k * 0.5) * 11 + (k % 2 ? 3 : -3); g.lineTo(x, y); } g.stroke(); }); }
      /* darah menetes + noise + scanline */
      g.fillStyle = '#b00018'; drips.forEach(d => { g.fillRect(Math.floor(d.x), 0, d.w, Math.floor(Math.min(160, u * d.v * 2.4))); });
      g.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 160; i++) g.fillRect(Math.floor(Math.random() * 176), Math.floor(Math.random() * 160), 1, 1);
      g.fillStyle = 'rgba(0,0,0,.3)'; for (let y = 0; y < 160; y += 3) g.fillRect(0, y, 176, 1);
      if (!calm && Math.random() < 0.18) { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, Math.floor(Math.random() * 160), 176, 2 + Math.floor(Math.random() * 6)); }
      /* gelap mendadak, lalu muncul sekejap lagi (tipuan) */

      else if (u >= 1.68) { g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, 176, 160); }

  B.floats = B.floats.filter(f => (f.life -= dt * 1.1) > 0); B.floats.forEach(f => { f.y -= 18 * dt; });
}

  if (B.boss) { for (let i = 0; i < 9; i++) { const a = T * (0.8 + B.phase * 0.5) + i * 0.7, r = 46 + Math.sin(T + i) * 6; cx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.3 * Math.sin(T * 2 + i)) + ')'; cx.fillRect(Math.round(88 + Math.cos(a) * r), Math.round(78 + Math.sin(a) * r * 0.8), 3, 3); } }
  cx.globalAlpha = 0.45 * B.alpha; cx.fillStyle = '#000'; cx.beginPath(); cx.ellipse(88, 122, 32 - bob, 5, 0, 0, 7); cx.fill();

/* ---- Putaran utama & boot ---- */
let lastT = 0;
function render() {
  cx.imageSmoothingEnabled = false;
  if (OUT.on) drawOutside();
  else if (mode === 'title') drawTitle(false);
  else if (mode === 'end') drawTitle(true);
  else if (mode === 'intro') drawIntro();
  else if (B) drawBattle();
  else if (F && G) drawWorld();
  if (fadeA > 0) { cx.fillStyle = 'rgba(0,0,0,' + fadeA + ')'; cx.fillRect(0, 0, CW, CH); }
}
function loop(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000) || 0.016); lastT = t; T += dt;
  try { Dlg.update(dt); Pull.update(dt); introUpdate(dt); outsideUpdate(dt); updateBattle(dt); if (G && F && !OUT.on && mode !== 'title' && mode !== 'end' && mode !== 'intro') updateWorld(dt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

  buildArt();
  $('#tBag').addEventListener('click', () => { Snd.init(); openBag(); });

  $('#tChat').addEventListener('click', () => { Snd.init(); openChat(); });
  $('#tSnd').addEventListener('click', () => { Snd.init(); openSound(); });
  $('#tSnd').classList.toggle('on', !S.sound);
  $('#fsb').addEventListener('click', e => { e.stopPropagation(); toggleFS(); });
  $('#netb').addEventListener('click', e => { e.stopPropagation(); netOpen(); });
  document.addEventListener('fullscreenchange', fsSync); document.addEventListener('webkitfullscreenchange', fsSync);
  $('#stage').addEventListener('pointerdown', e => { if (Pull.active) { e.preventDefault(); act('ok'); } });
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch') $('#app').classList.add('touch'); }, { passive: true });
  try { if (matchMedia('(pointer:coarse)').matches) $('#app').classList.add('touch'); } catch (e) { }
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && F && mode === 'world') saveGame(); });
  showTitle('splash'); requestAnimationFrame(loop);
}
boot();
